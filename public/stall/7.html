<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>stall test</title><style>body{margin:0;background:#030014;color:#e2e8f0;font:18px system-ui}main{position:relative;z-index:1;padding:24px}a.plain{display:block;margin:16px 0;color:#67e8f9}</style><style>.card{position:relative;display:block;margin:16px 0;padding:32px;border-radius:16px;overflow:hidden;background:#ffffff0a;border:1px solid #ffffff1a;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);transform-style:preserve-3d;will-change:transform;transition:transform .15s ease-out,background .3s,border-color .3s,box-shadow .3s;color:#fff;text-decoration:none}.card:hover{background:#ffffff12;border-color:#22d3ee66;box-shadow:0 0 30px -5px #22d3ee59}.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,#22d3ee99,#a78bfa26,#e879f980);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}.glow{position:absolute;inset:0;opacity:0;transition:opacity .3s;pointer-events:none}.card:hover .glow{opacity:1}</style></head><body><main><h1>7. Real card (tilt, glass, neon border)</h1><div class="card" data-tilt><div class="glow"></div><a href="https://defiknight.mrqg.dev/" target="_blank" rel="noopener noreferrer" style="position:relative;color:#67e8f9">DefiKnight (card)</a></div><div class="card" data-tilt><div class="glow"></div><a href="https://kotkit.mrqg.dev/" target="_blank" rel="noopener noreferrer" style="position:relative;color:#67e8f9">TikTok Downloader (card)</a></div><a class="plain" href="/stall/index.html">Back to list</a></main><script>document.querySelectorAll("[data-tilt]").forEach(el=>{const g=el.querySelector(".glow");el.addEventListener("mousemove",e=>{const r=el.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;el.style.transform=`perspective(800px) rotateX(${(y-r.height/2)/r.height*-8}deg) rotateY(${(x-r.width/2)/r.width*8}deg)`;g.style.background=`radial-gradient(400px circle at ${x}px ${y}px, rgba(34,211,238,0.12), transparent 60%)`});el.addEventListener("mouseleave",()=>{el.style.transform="perspective(800px) rotateX(0deg) rotateY(0deg)"})})</script></body></html>
